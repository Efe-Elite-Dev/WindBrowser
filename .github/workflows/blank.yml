name: WindBrowser Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 PyQtWebEngine pyinstaller

    - name: EXE Derle
      run: pyinstaller --onefile --noconsole --name=WindBrowser windbrowser.py

    - name: WIND Paketi Hazirla
      shell: bash
      run: |
        mkdir -p WindBrowser_WindOS
        cp windbrowser.py WindBrowser_WindOS/
        echo "AppName: WindBrowser" > WindBrowser_WindOS/manifest.txt
        echo "Core: WindOS V7" >> WindBrowser_WindOS/manifest.txt
        tar -czf WindBrowser.wind WindBrowser_WindOS

    - name: Paketleri Cikti Olarak Ver
      uses: actions/upload-artifact@v4
      with:
        name: WindBrowser-Surumleri
        path: |
          dist/*.exe
          *.wind
